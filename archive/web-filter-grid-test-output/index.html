  <title>Web Filter Grid Test Output</title>
  <style>

    h1 { margin: 0 0 8px; font-size: 20px; }
    .meta { color: #a0a0a0; font-size: 13px; }
    .grid { display: grid; gap: 16px; padding: 24px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    figure { margin: 0; background: #111; border: 1px solid #222; border-radius: 8px; padding: 12px; }
    figcaption { font-size: 12px; color: #c8c8c8; margin-bottom: 8px; word-break: break-all; }
    img { width: 100%; height: auto; display: block; background: #000; }
  </style>
