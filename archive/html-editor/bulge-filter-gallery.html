<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WesWorld FX - Filter Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #64b5f6 0%, #81c784 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #888;
            font-size: 1.1em;
            margin-bottom: 30px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        input[type="file"],
        input[type="text"] {
            padding: 12px 15px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #2a2a3e;
            color: #e0e0e0;
            font-size: 1em;
        }

        input[type="file"] {
            flex: 1;
            min-width: 250px;
            max-width: 400px;
        }

        input[type="text"] {
            flex: 1;
            min-width: 200px;
            max-width: 300px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #64b5f6 0%, #42a5f5 100%);
            color: white;
        }

        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(100, 181, 246, 0.4);
            transform: translateY(-2px);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .filter-card {
            background: #2a2a3e;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #444;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .filter-card:hover {
            border-color: #64b5f6;
            box-shadow: 0 12px 40px rgba(100, 181, 246, 0.2);
            transform: translateY(-5px);
        }

        .filter-preview {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-bottom: 1px solid #444;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-canvas {
            width: 100%;
            height: 100%;
        }

        .filter-info {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .filter-name {
            font-size: 1.3em;
            font-weight: 700;
            color: #64b5f6;
            margin-bottom: 10px;
        }

        .filter-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 0.9em;
        }

        .stat {
            background: #1a1a2e;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            text-align: center;
        }

        .stat-label {
            color: #888;
            font-size: 0.85em;
            margin-bottom: 3px;
        }

        .stat-value {
            color: #81c784;
            font-weight: 600;
        }

        .filter-points {
            background: #1a1a2e;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #444;
        }

        .point-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            font-size: 0.85em;
            border-bottom: 1px solid #333;
        }

        .point-item:last-child {
            border-bottom: none;
        }

        .point-icon {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .point-bulge {
            background: #ffd54f;
            box-shadow: 0 0 6px #ffd54f;
        }

        .point-pinch {
            background: #ef5350;
            box-shadow: 0 0 6px #ef5350;
        }

        .point-text {
            flex-grow: 1;
            color: #bbb;
        }

        .filter-actions {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }

        .filter-actions button {
            flex: 1;
            padding: 10px;
            font-size: 0.9em;
        }

        .btn-edit {
            background: #64b5f6;
            color: white;
        }

        .btn-edit:hover {
            background: #42a5f5;
        }

        .btn-copy {
            background: #81c784;
            color: white;
        }

        .btn-copy:hover {
            background: #66bb6a;
        }

        .btn-delete {
            background: #ef5350;
            color: white;
        }

        .btn-delete:hover {
            background: #e53935;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .empty-state h2 {
            color: #888;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #666;
        }

        .sample-filters {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 1px solid #444;
        }

        .sample-filters h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #64b5f6;
        }

        .message {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: rgba(129, 199, 132, 0.2);
            border-left: 4px solid #81c784;
            color: #a5d6a7;
        }

        .message.error {
            background: rgba(239, 83, 80, 0.2);
            border-left: 4px solid #ef5350;
            color: #ef9a9a;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
        }

        .modal-content {
            background-color: #2a2a3e;
            margin: 10% auto;
            padding: 30px;
            border: 1px solid #444;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            color: #e0e0e0;
        }

        .modal-header {
            font-size: 1.3em;
            font-weight: 700;
            color: #64b5f6;
            margin-bottom: 20px;
        }

        .modal-body {
            margin-bottom: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-footer button {
            padding: 10px 20px;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #1a1a2e;
            color: #81c784;
            font-family: monospace;
            font-size: 0.85em;
            resize: vertical;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.9em;
            border-top: 1px solid #444;
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
            }

            .gallery {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💎 WesWorld FX - Filter Gallery</h1>
            <p class="subtitle">View and manage your custom bulge filters</p>
        </header>

        <div id="message" class="message"></div>

        <div class="controls">
            <input type="file" id="fileInput" accept=".json,.wwfxfilter" />
            <button class="btn-primary" onclick="loadFile()">📂 Load Filter</button>
            <button class="btn-primary" onclick="createSampleFilters()">⭐ Load Samples</button>
        </div>

        <div id="gallery" class="gallery"></div>

        <div id="emptyState" class="empty-state">
            <div class="empty-state-icon">📋</div>
            <h2>No Filters Loaded</h2>
            <p>Load a filter file or create samples to get started</p>
        </div>

        <div class="sample-filters" id="sampleSection" style="display: none;">
            <h2>Sample Filters</h2>
            <div id="sampleGallery" class="gallery"></div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Edit JSON</div>
            <div class="modal-body">
                <textarea id="editJSON"></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn-primary" onclick="saveEdit()">Save</button>
                <button class="btn-copy" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <footer>
        <p>WesWorld FX v2.1.2 • Filter Gallery • © 2026 WesWorld</p>
    </footer>

    <script>
        const filters = [];
        let currentEditIndex = null;

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type} show`;
            setTimeout(() => msg.classList.remove('show'), 3000);
        }

        function loadFile() {
            const input = document.getElementById('fileInput');
            const file = input.files[0];

            if (!file) {
                showMessage('Please select a file', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const json = JSON.parse(e.target.result);
                    
                    // Handle both single filter and filter export format
                    if (json.points && json.name) {
                        // Single filter
                        filters.push(json);
                    } else if (json.filters) {
                        // Export format
                        filters.push(...json.filters);
                    }

                    renderGallery();
                    showMessage(`Loaded ${filters.length} filter(s)`, 'success');
                } catch (error) {
                    showMessage('Invalid JSON file: ' + error.message, 'error');
                }
            };

            reader.readAsText(file);
        }

        function createSampleFilters() {
            filters.length = 0;

            // Sample 1: Big Eyes
            filters.push({
                name: "Big Eyes Effect",
                id: generateUUID(),
                points: [
                    { x: 0.35, y: 0.65, radius: 0.12, strength: 0.8 },
                    { x: 0.65, y: 0.65, radius: 0.12, strength: 0.8 }
                ]
            });

            // Sample 2: Slim Face
            filters.push({
                name: "Slim Face",
                id: generateUUID(),
                points: [
                    { x: 0.3, y: 0.5, radius: 0.15, strength: -0.6 },
                    { x: 0.7, y: 0.5, radius: 0.15, strength: -0.6 }
                ]
            });

            // Sample 3: Pinch Cheeks
            filters.push({
                name: "Pinch Cheeks",
                id: generateUUID(),
                points: [
                    { x: 0.25, y: 0.45, radius: 0.1, strength: -0.5 },
                    { x: 0.75, y: 0.45, radius: 0.1, strength: -0.5 }
                ]
            });

            // Sample 4: Funhouse Mirror
            filters.push({
                name: "Funhouse Mirror",
                id: generateUUID(),
                points: [
                    { x: 0.2, y: 0.3, radius: 0.15, strength: 0.7 },
                    { x: 0.5, y: 0.5, radius: 0.2, strength: -0.5 },
                    { x: 0.8, y: 0.7, radius: 0.15, strength: 0.7 }
                ]
            });

            // Sample 5: Bulbous Nose
            filters.push({
                name: "Bulbous Nose",
                id: generateUUID(),
                points: [
                    { x: 0.5, y: 0.4, radius: 0.08, strength: 0.9 }
                ]
            });

            // Sample 6: Wide Smile
            filters.push({
                name: "Wide Smile",
                id: generateUUID(),
                points: [
                    { x: 0.3, y: 0.25, radius: 0.1, strength: 0.6 },
                    { x: 0.7, y: 0.25, radius: 0.1, strength: 0.6 }
                ]
            });

            renderGallery();
            showMessage('Loaded 6 sample filters', 'success');
        }

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            const emptyState = document.getElementById('emptyState');

            if (filters.length === 0) {
                gallery.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            gallery.innerHTML = '';

            filters.forEach((filter, index) => {
                const card = createFilterCard(filter, index);
                gallery.appendChild(card);
            });
        }

        function createFilterCard(filter, index) {
            const card = document.createElement('div');
            card.className = 'filter-card';

            const preview = document.createElement('div');
            preview.className = 'filter-preview';

            const canvas = document.createElement('canvas');
            canvas.className = 'preview-canvas';
            preview.appendChild(canvas);

            // Draw preview
            setTimeout(() => drawPreview(canvas, filter), 100);

            const info = document.createElement('div');
            info.className = 'filter-info';

            const name = document.createElement('div');
            name.className = 'filter-name';
            name.textContent = filter.name;

            const stats = document.createElement('div');
            stats.className = 'filter-stats';
            stats.innerHTML = `
                <div class="stat">
                    <div class="stat-label">Points</div>
                    <div class="stat-value">${filter.points.length}</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Type</div>
                    <div class="stat-value">${filter.points.every(p => p.strength >= 0) ? 'Bulge' : 'Mixed'}</div>
                </div>
            `;

            const points = document.createElement('div');
            points.className = 'filter-points';
            points.innerHTML = filter.points.map((p, i) => `
                <div class="point-item">
                    <div class="point-icon ${p.strength >= 0 ? 'point-bulge' : 'point-pinch'}"></div>
                    <div class="point-text">
                        Point ${i + 1}: (${p.x.toFixed(2)}, ${p.y.toFixed(2)}) 
                        <span style="color: #888;">r=${p.radius.toFixed(2)} s=${p.strength.toFixed(2)}</span>
                    </div>
                </div>
            `).join('');

            const actions = document.createElement('div');
            actions.className = 'filter-actions';
            actions.innerHTML = `
                <button class="btn-copy" onclick="copyToClipboard(${index})">📋 Copy</button>
                <button class="btn-edit" onclick="editFilter(${index})">✏️ Edit</button>
                <button class="btn-delete" onclick="deleteFilter(${index})">🗑️ Delete</button>
            `;

            info.appendChild(name);
            info.appendChild(stats);
            info.appendChild(points);
            info.appendChild(actions);

            card.appendChild(preview);
            card.appendChild(info);

            return card;
        }

        function drawPreview(canvas, filter) {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;

            const ctx = canvas.getContext('2d');

            // Draw background
            const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, '#1a1a2e');
            grad.addColorStop(1, '#16213e');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            ctx.strokeStyle = 'rgba(100, 100, 100, 0.15)';
            ctx.lineWidth = 1;
            const spacing = 25;
            for (let i = spacing; i < canvas.width; i += spacing) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = spacing; i < canvas.height; i += spacing) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Draw bulge points
            filter.points.forEach((point, idx) => {
                const px = point.x * canvas.width;
                const py = (1 - point.y) * canvas.height;
                const radius = point.radius * Math.min(canvas.width, canvas.height);

                // Radius circle
                ctx.strokeStyle = '#81c784';
                ctx.lineWidth = 1.5;
                ctx.globalAlpha = 0.5;
                ctx.beginPath();
                ctx.arc(px, py, radius, 0, Math.PI * 2);
                ctx.stroke();

                // Center point
                ctx.globalAlpha = 1;
                ctx.fillStyle = point.strength >= 0 ? '#ffd54f' : '#ef5350';
                ctx.beginPath();
                ctx.arc(px, py, 4, 0, Math.PI * 2);
                ctx.fill();

                // Border
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            });
        }

        function copyToClipboard(index) {
            const filter = filters[index];
            const json = JSON.stringify(filter, null, 2);
            navigator.clipboard.writeText(json).then(() => {
                showMessage(`Copied '${filter.name}' to clipboard`, 'success');
            });
        }

        function editFilter(index) {
            currentEditIndex = index;
            const filter = filters[index];
            document.getElementById('editJSON').value = JSON.stringify(filter, null, 2);
            document.getElementById('editModal').style.display = 'block';
        }

        function saveEdit() {
            try {
                const json = JSON.parse(document.getElementById('editJSON').value);
                filters[currentEditIndex] = json;
                closeModal();
                renderGallery();
                showMessage('Filter updated', 'success');
            } catch (error) {
                showMessage('Invalid JSON: ' + error.message, 'error');
            }
        }

        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        function deleteFilter(index) {
            if (confirm(`Delete '${filters[index].name}'?`)) {
                filters.splice(index, 1);
                renderGallery();
                showMessage('Filter deleted', 'success');
            }
        }

        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // Close modal on outside click
        window.onclick = (event) => {
            const modal = document.getElementById('editModal');
            if (event.target === modal) {
                closeModal();
            }
        };
    </script>
</body>
</html>
