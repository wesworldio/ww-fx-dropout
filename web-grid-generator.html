<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WesWorld FX Web Grid Generator</title>
  <style>
    body { margin: 0; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="gridCanvas"></canvas>
  <script>
    var canvas = document.getElementById('gridCanvas');
    var ctx = canvas.getContext('2d');

    function calculateDistortionVector(x, y, width, height, filterType) {
      var centerX = width / 2;
      var centerY = height / 2;
      var dx = x - centerX;
      var dy = y - centerY;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var angle = Math.atan2(dy, dx);
      var radius = Math.min(width, height) / 2;
      var normalizedDist = Math.min(dist / radius, 1);

      var newX = x;
      var newY = y;

      switch (filterType) {
        case 'water_ripple':
        case 'ripple':
          var frequency = filterType === 'water_ripple' ? 0.05 : 0.1;
          var amplitude = filterType === 'water_ripple' ? 15 : 20;
          var ripple = Math.sin(dist * frequency) * amplitude;
          newX = x + ripple * Math.cos(angle);
          newY = y + ripple * Math.sin(angle);
          break;
        case 'pincushion':
          var strength = 0.4;
          var newDist = normalizedDist * (1 - strength * normalizedDist) * radius;
          newX = centerX + newDist * Math.cos(angle);
          newY = centerY + newDist * Math.sin(angle);
          break;
        case 'bulge':
          var bulgeStrength = 0.5;
          var bulgeRadius = radius;
          var distSq = dist * dist;
          var maxDistSq = bulgeRadius * bulgeRadius;
          if (distSq < maxDistSq) {
            var factor = 1.0 - (dist / bulgeRadius) * bulgeStrength;
            newX = centerX + dx * factor;
            newY = centerY + dy * factor;
          }
          break;
        case 'swirl':
          var swirlStrength = 2.0;
          if (dist < radius) {
            var maxAngle = swirlStrength * (1.0 - normalizedDist);
            var newAngle = angle + maxAngle;
            newX = centerX + dist * Math.cos(newAngle);
            newY = centerY + dist * Math.sin(newAngle);
          }
          break;
        case 'fisheye':
          var fisheyeStrength = 0.5;
          var fisheyeFactor = 1.0 - fisheyeStrength * normalizedDist;
          newX = centerX + dx * fisheyeFactor;
          newY = centerY + dy * fisheyeFactor;
          break;
        case 'barrel':
          var barrelStrength = 0.3;
          var barrelNewDist = normalizedDist * (1 + barrelStrength * normalizedDist * normalizedDist) * radius;
          newX = centerX + barrelNewDist * Math.cos(angle);
          newY = centerY + barrelNewDist * Math.sin(angle);
          break;
        case 'radial_squeeze':
          var squeezeStrength = 1.8;
          var squeezeNewDist = normalizedDist * (1 + squeezeStrength * normalizedDist * normalizedDist) * radius;
          newX = centerX + squeezeNewDist * Math.cos(angle);
          newY = centerY + squeezeNewDist * Math.sin(angle);
          break;
        case 'squish_face':
          var squishStrength = 1.1;
          var squishDy = dy / (height / 2);
          var squishFactor = 1.0 - squishStrength * squishDy * squishDy;
          newX = centerX + dx / squishFactor;
          newY = y;
          break;
        case 'stretch_face':
          var stretchFaceStrength = 1.4;
          var stretchFaceDx = dx / (width / 2);
          var stretchFaceFactor = 1.0 + stretchFaceStrength * stretchFaceDx * stretchFaceDx;
          newX = x;
          newY = centerY + dy / stretchFaceFactor;
          break;
        case 'pinch_cheeks':
          var pinchCheeksStrength = 0.35;
          var pinchCheeksFactor = 1.0 - pinchCheeksStrength * Math.abs(Math.cos(angle)) * normalizedDist;
          var pinchCheeksNewDist = dist * pinchCheeksFactor;
          newX = centerX + pinchCheeksNewDist * Math.cos(angle);
          newY = centerY + pinchCheeksNewDist * Math.sin(angle);
          break;
        case 'wobble_face':
        case 'radial_wobble':
          var wobbleStrength = 12;
          var wobble = wobbleStrength * Math.sin(angle * 6) * normalizedDist;
          var wobbleNewDist = dist + wobble;
          newX = centerX + wobbleNewDist * Math.cos(angle);
          newY = centerY + wobbleNewDist * Math.sin(angle);
          break;
        case 'multi_ripple':
          var ripple1 = Math.sin(dist * 0.05) * 5;
          var ripple2 = Math.sin(dist * 0.08) * 3;
          var ripple3 = Math.sin(dist * 0.12) * 2;
          var totalRipple = ripple1 + ripple2 + ripple3;
          newX = x + totalRipple * Math.cos(angle);
          newY = y + totalRipple * Math.sin(angle);
          break;
        case 'elastic_stretch':
          var elasticStrength = 2.0;
          var elasticFactor = 1.0 + elasticStrength * Math.sin(normalizedDist * Math.PI);
          var elasticNewDist = normalizedDist * elasticFactor * radius;
          newX = centerX + elasticNewDist * Math.cos(angle);
          newY = centerY + elasticNewDist * Math.sin(angle);
          break;
        case 'wave_distortion':
          var waveX = Math.sin(dist * 0.08 + angle * 2) * 6;
          var waveY = Math.cos(dist * 0.06 - angle * 2) * 6;
          newX = x + waveX;
          newY = y + waveY;
          break;
        case 'squeeze_horizontal':
          var squeezeHDx = dx / (width / 2);
          var squeezeHFactor = 1.0 - 1.4 * squeezeHDx * squeezeHDx;
          newX = centerX + dx * squeezeHFactor;
          newY = y;
          break;
        case 'squeeze_vertical':
          var squeezeVDy = dy / (height / 2);
          var squeezeVFactor = 1.0 - 1.4 * squeezeVDy * squeezeVDy;
          newX = x;
          newY = centerY + dy * squeezeVFactor;
          break;
        case 'complex_ripple':
          var radialRipple = Math.sin(dist * 0.06) * 6;
          var angularRipple = Math.sin(angle * 4) * 3;
          var complexTotalRipple = radialRipple + angularRipple;
          newX = x + complexTotalRipple * Math.cos(angle);
          newY = y + complexTotalRipple * Math.sin(angle);
          break;
        case 'gentle_ripple':
          var gentleFrequency = 0.04;
          var gentleAmplitude = 12;
          var gentleRipple = Math.sin(dist * gentleFrequency) * gentleAmplitude;
          newX = x + gentleRipple * Math.cos(angle);
          newY = y + gentleRipple * Math.sin(angle);
          break;
        case 'ultimate_distortion':
          var normDx = dx / (width / 2);
          var normDy = dy / (height / 2);
          var horizontalStretch = 0.3 * Math.sin(normDy * Math.PI * 2) * normDx;
          var normDist = Math.sqrt(normDx * normDx + normDy * normDy);
          var ultRipple1 = Math.sin(normDist * 8) * 0.02;
          var ultRipple2 = Math.sin(normDist * 15) * 0.01;
          var ultWobble = 0.1 * Math.sin(normDx * Math.PI * 3) * Math.cos(normDy * Math.PI * 2);
          var distortX = horizontalStretch + ultRipple1 + ultRipple2 + ultWobble;
          var distortY = ultRipple1 * 1.5 + ultRipple2 * 0.8;
          newX = centerX + dx * (1 + distortX);
          newY = centerY + dy * (1 + distortY);
          break;
        case 'lens_distortion':
          var lensStrength = 0.7;
          var lensFactor = 1.0 - lensStrength * normalizedDist * normalizedDist;
          newX = centerX + dx * lensFactor;
          newY = centerY + dy * lensFactor;
          break;
        case 'funhouse_mirror':
          var funhouseStrength = 0.4;
          var funhouseDx = dx / (width / 2);
          var funhouseStretch = 1.0 + funhouseStrength * Math.sin(funhouseDx * Math.PI);
          newX = centerX + dx * funhouseStretch;
          newY = y;
          break;
        case 'bulge_eyes':
          var eyeOffsetX = width * 0.15;
          var eyeOffsetY = -height * 0.05;
          var leftEyeX = centerX - eyeOffsetX;
          var leftEyeY = centerY + eyeOffsetY;
          var rightEyeX = centerX + eyeOffsetX;
          var rightEyeY = centerY + eyeOffsetY;
          var eyeRadius = Math.min(width, height) * 0.12;
          var bulgeEyesStrength = 0.65;
          var dxLeft = x - leftEyeX;
          var dyLeft = y - leftEyeY;
          var distLeft = Math.sqrt(dxLeft * dxLeft + dyLeft * dyLeft);
          var dxRight = x - rightEyeX;
          var dyRight = y - rightEyeY;
          var distRight = Math.sqrt(dxRight * dxRight + dyRight * dyRight);
          if (distLeft < eyeRadius) {
            var factor = 1.0 - (distLeft / eyeRadius) * bulgeEyesStrength;
            newX = leftEyeX + dxLeft * factor;
            newY = leftEyeY + dyLeft * factor;
          } else if (distRight < eyeRadius) {
            var factorRight = 1.0 - (distRight / eyeRadius) * bulgeEyesStrength;
            newX = rightEyeX + dxRight * factorRight;
            newY = rightEyeY + dyRight * factorRight;
          }
          break;
        case 'warp_face':
          var warpStrength = 0.8;
          var warpDx = dx / (width / 2);
          var warpDy = dy / (height / 2);
          var warpX = warpDx * (1.0 + warpStrength * Math.sin(warpDy * Math.PI * 2));
          var warpY = warpDy * (1.0 + warpStrength * Math.cos(warpDx * Math.PI * 2));
          newX = centerX + warpX * (width / 2);
          newY = centerY + warpY * (height / 2);
          break;
        case 'funny_squash':
          var funnySquashStrength = 0.4;
          var funnySquashDy = dy / (height / 2);
          var funnySquashFactor = 1.0 - funnySquashStrength * funnySquashDy * funnySquashDy;
          newX = centerX + dx / funnySquashFactor;
          newY = y;
          break;
        case 'funny_stretch':
          var funnyStretchStrength = 1.2;
          var funnyStretchDx = dx / (width / 2);
          var funnyStretchFactor = 1.0 + funnyStretchStrength * funnyStretchDx * funnyStretchDx;
          newX = x;
          newY = centerY + dy / funnyStretchFactor;
          break;
        case 'elastic_face':
          var elasticFaceStrength = 0.5;
          var elasticFaceFactor = 1.0 + elasticFaceStrength * Math.sin(normalizedDist * Math.PI * 3) * 0.3;
          newX = centerX + dx * elasticFaceFactor;
          newY = centerY + dy * elasticFaceFactor;
          break;
        case 'smush_face':
          var smushStrength = 0.5;
          var smushFactor = 1.0 - smushStrength * normalizedDist;
          newX = centerX + dx * smushFactor;
          newY = centerY + dy * smushFactor;
          break;
        default:
          return { x: x, y: y };
      }

      return { x: newX, y: newY };
    }

    function drawWireframeOverlay(ctx, width, height, filterType) {
      if (!filterType) {
        return;
      }

      var colorFilters = ['black_white', 'sepia', 'negative', 'vintage', 'neon_glow',
        'red_tint', 'blue_tint', 'green_tint', 'posterize', 'thermal', 'pixelate',
        'blur', 'sharpen', 'emboss', 'sketch', 'cartoon', 'rainbow', 'rainbow_shift',
        'ice', 'ocean', 'plasma', 'jet', 'turbo', 'inferno', 'magma', 'viridis',
        'cool', 'hot', 'spring', 'summer', 'autumn', 'winter', 'vhs', 'retro',
        'cyberpunk', 'anime', 'glow', 'solarize', 'edge_detect', 'halftone', 'acid_trip'];

      if (colorFilters.indexOf(filterType) !== -1) {
        return;
      }

      ctx.save();
      ctx.strokeStyle = 'rgb(255, 255, 0)';
      ctx.lineWidth = 1;
      ctx.globalCompositeOperation = 'source-over';

      var gridSize = 30;
      var gridOffset = 5;

      for (var y = gridOffset; y < height; y += gridSize) {
        ctx.beginPath();
        var pathStarted = false;

        for (var x = gridOffset; x < width; x += gridOffset) {
          var distorted = calculateDistortionVector(x, y, width, height, filterType);
          if (distorted && (distorted.x !== x || distorted.y !== y || filterType !== 'default')) {
            if (distorted.x >= 0 && distorted.x < width && distorted.y >= 0 && distorted.y < height) {
              if (!pathStarted) {
                ctx.moveTo(distorted.x, distorted.y);
                pathStarted = true;
              } else {
                ctx.lineTo(distorted.x, distorted.y);
              }
            }
          }
        }

        if (pathStarted) {
          ctx.stroke();
        }
      }

      for (var x2 = gridOffset; x2 < width; x2 += gridSize) {
        ctx.beginPath();
        var pathStartedVertical = false;

        for (var y2 = gridOffset; y2 < height; y2 += gridOffset) {
          var distortedVertical = calculateDistortionVector(x2, y2, width, height, filterType);
          if (distortedVertical && (distortedVertical.x !== x2 || distortedVertical.y !== y2 || filterType !== 'default')) {
            if (distortedVertical.x >= 0 && distortedVertical.x < width && distortedVertical.y >= 0 && distortedVertical.y < height) {
              if (!pathStartedVertical) {
                ctx.moveTo(distortedVertical.x, distortedVertical.y);
                pathStartedVertical = true;
              } else {
                ctx.lineTo(distortedVertical.x, distortedVertical.y);
              }
            }
          }
        }

        if (pathStartedVertical) {
          ctx.stroke();
        }
      }

      ctx.fillStyle = 'rgb(255, 255, 0)';
      ctx.beginPath();
      ctx.arc(width / 2, height / 2, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    window.generateGridImage = function (filterType, width, height) {
      var outWidth = width || 1280;
      var outHeight = height || 720;
      canvas.width = outWidth;
      canvas.height = outHeight;
      ctx.clearRect(0, 0, outWidth, outHeight);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, outWidth, outHeight);
      drawWireframeOverlay(ctx, outWidth, outHeight, filterType);
      return canvas.toDataURL('image/png');
    };
  </script>
</body>
</html>
